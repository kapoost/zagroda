<meta charset="utf-8" />
<title>Zagroda</title>
<style>
  :root {
    --bg: #11170f;
    --panel: #1b2217;
    --ink: #e7e2cf;
    --dim: #8f9583;
    --accent: #c9a227;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  /* min-width:0 + basis 0 — bez tego canvas rozpycha flexa swoją szerokością atrybutową i rośnie z każdym resize. */
  #world { flex: 1 1 0; min-width: 0; display: block; background: #0d1512; }
  #side {
    width: 290px;
    flex: none;
    background: var(--panel);
    border-left: 1px solid #2c3626;
    padding: 14px;
    overflow-y: auto;
  }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: 0.06em; text-transform: uppercase; }
  h2 { font-size: 11px; margin: 16px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
  #clock { color: var(--accent); font-variant-numeric: tabular-nums; }
  .bar { height: 7px; background: #2c3626; border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
  .bar span { display: block; height: 100%; background: linear-gradient(90deg, #7fb65c, #c9a227); }
  small { color: var(--dim); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 2px 0; }
  li.dim, .dim { color: var(--dim); }
  li.sel { color: var(--accent); }
  li.cant { color: #6f7564; }
  li.can kbd { background: var(--accent); color: #1b2217; }
  kbd {
    display: inline-block; min-width: 15px; text-align: center;
    background: #2c3626; border-radius: 3px; padding: 0 3px;
    font: 11px ui-monospace, monospace;
  }
  #log li { color: var(--dim); font-size: 12px; }
  #log li:first-child { color: var(--ink); }
  #keys { color: var(--dim); font-size: 11px; line-height: 1.7; }
  #keys b { color: var(--ink); font-weight: 600; }
</style>
<canvas id="world"></canvas>
<aside id="side">
  <h1>Zagroda</h1>
  <div id="clock"></div>
  <div id="energy"></div>
  <h2>Ekwipunek</h2>
  <div id="held" class="dim"></div>
  <ul id="inventory"></ul>
  <h2>Wytwarzanie</h2>
  <ul id="recipes"></ul>
  <h2>Dziennik</h2>
  <ul id="log"></ul>
  <h2>Klawisze</h2>
  <div id="keys">
    <b>WSAD</b> / strzałki — ruch<br />
    <b>Spacja</b> — użyj tego, co w ręce<br />
    <b>Q</b> / <b>E</b> — zmień przedmiot w ręce<br />
    <b>G</b> — postaw, <b>F</b> — zjedz<br />
    <b>1-9</b> — wytwórz z listy powyżej
  </div>
</aside>
<script type="module" src="/src/main.ts"></script>
